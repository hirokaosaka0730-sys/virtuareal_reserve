<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#332333" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VirtuaReal予約" />
    <title>Studio VirtuaReal｜予約管理</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">STUDIO VIRTUAREAL</p>
        <h1>予約顧客管理</h1>
      </div>
      <div class="header-actions">
        <button class="button ghost" id="downloadCsv">CSVを書き出す</button>
        <button class="button ghost" id="downloadJson">バックアップ</button>
        <label class="button ghost file-button">復元<input id="restoreJson" type="file" accept="application/json" /></label>
      </div>
    </header>

    <main>
      <section class="capture-panel" aria-labelledby="capture-title">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">予約メールをそのまま貼り付け</p>
            <h2 id="capture-title">予約内容を読み取る</h2>
          </div>
          <span class="local-badge">このブラウザ内に保存</span>
        </div>
        <textarea id="reservationText" placeholder="Studio VirtuaRealの予約確定メール、フォーム通知、別媒体の予約文を貼り付けてください。\n例：利用日・氏名・プラン・合計金額を含む本文"></textarea>
        <div class="capture-actions">
          <p id="parseHint">日付・氏名・時間・プラン・金額・オプションを自動抽出し、空いている予約番号へ配置します。</p>
          <button class="button primary" id="parseReservation">内容を確認する</button>
        </div>
      </section>

      <section class="schedule-section" aria-labelledby="schedule-title">
        <div class="schedule-toolbar">
          <div>
            <p class="eyebrow">月間予約表</p>
            <h2 id="schedule-title">予約一覧</h2>
            <p class="month-total" id="monthTotal"></p>
          </div>
          <div class="month-controls">
            <button class="icon-button" id="previousMonth" aria-label="前月">‹</button>
            <label>表示月<input id="monthPicker" type="month" /></label>
            <button class="icon-button" id="nextMonth" aria-label="翌月">›</button>
            <button class="button ghost" id="newReservation">＋ 手動追加</button>
          </div>
        </div>
        <p class="table-help">スマホでは月内を左右にスワイプできます。左端の予約番号は固定され、予約カードを選択すると編集できます。</p>
        <div class="table-wrap"><table id="scheduleTable"></table></div>
      </section>
    </main>

    <dialog id="reservationDialog">
      <form id="reservationForm" method="dialog">
        <div class="dialog-heading"><h2 id="dialogTitle">予約内容の確認</h2><button class="close-button" type="button" data-dialog-cancel aria-label="閉じる">×</button></div>
        <div class="form-grid">
          <label>利用日<input name="date" type="date" required /></label>
          <label>予約番号<select name="slot"><option value="予約1">予約1</option><option value="予約2">予約2</option><option value="予約3">予約3</option></select></label>
          <label>お名前<input name="customer" required placeholder="代表者名" /></label>
          <label>利用時間<input name="time" placeholder="例：9:30〜14:30" /></label>
          <label class="wide">プラン<input name="plan" placeholder="例：土日祝プラン A枠" /></label>
          <label>合計金額<input name="amount" inputmode="numeric" placeholder="例：19800" /></label>
          <label class="wide">オプション<input name="options" placeholder="例：駐車場利用、大型シャンデリアLED点灯" /></label>
          <label class="wide">メモ<textarea name="memo" placeholder="備考・抽出できなかった内容を記入"></textarea></label>
          <details class="wide mail-history" open>
            <summary>貼り付けたメール履歴</summary>
            <textarea name="sourceText" readonly placeholder="自動登録した予約メールの全文がここに保存されます。"></textarea>
          </details>
        </div>
        <div class="dialog-actions"><button class="button danger" type="button" id="deleteReservation">削除</button><span></span><button class="button ghost" type="button" data-dialog-cancel>キャンセル</button><button class="button primary" value="default">保存する</button></div>
      </form>
    </dialog>

    <template id="reservationCardTemplate"><article class="reservation-card"><button class="card-main" type="button"><strong class="card-name"></strong><span class="card-time"></span><span class="card-plan"></span><span class="card-amount"></span></button></article></template>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
      }
    </script>
  </body>
</html>
